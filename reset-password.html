
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | R.R Designers</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5eaff, #fff5f8);
      color: #34264d;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 32px 25px;
      background: white;
      border: 1px solid #eadcf7;
      border-radius: 22px;
      box-shadow: 0 15px 45px #4b28651c;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #786c8d;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9c9e9;
      border-radius: 10px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #b794f4;
      border-color: transparent;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(110deg, #8b5cf6, #d9468f);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #passwordWarning {
      min-height: 20px;
      margin: 10px 0 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #7c3aed;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <h1>Reset Password</h1>
    <p class="subtitle">
      Create a new password for your owner account.
    </p>

    <form id="resetPasswordForm">
      <label for="newPassword">New Password</label>
      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Enter new password"
        minlength="8"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Re-enter new password"
        minlength="8"
        required
      >

      <p id="passwordWarning" role="status" aria-live="polite"></p>

      <button id="resetButton" type="submit">
        Update Password
      </button>
    </form>

    <a class="back-link" href="admin.html">
      Back to Owner Login
    </a>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const db = supabaseClient;

    const resetForm = document.getElementById("resetPasswordForm");
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const warning = document.getElementById("passwordWarning");
    const resetButton = document.getElementById("resetButton");

    let recoveryReady = false;

    function showWarning(message, color = "#c62828") {
      warning.textContent = message;
      warning.style.color = color;
    }

    function checkPasswords() {
      if (!confirmPassword.value) {
        showWarning("");
        return false;
      }

      if (newPassword.value !== confirmPassword.value) {
        showWarning("Passwords do not match.");
        return false;
      }

      showWarning("Passwords match.", "#16803c");
      return true;
    }

    newPassword.addEventListener("input", checkPasswords);
    confirmPassword.addEventListener("input", checkPasswords);

    async function initialiseRecovery() {
      resetButton.disabled = true;

      try {
        const { data, error } = await db.auth.getSession();

        if (error) throw error;

        if (data.session) {
          recoveryReady = true;
          resetButton.disabled = false;
          showWarning("Enter your new password.", "#786c8d");
        } else {
          showWarning(
            "Open this page using the password reset link sent to your email."
          );
        }

        db.auth.onAuthStateChange((event, session) => {
          if (event === "PASSWORD_RECOVERY" && session) {
            recoveryReady = true;
            resetButton.disabled = false;
            showWarning("Enter your new password.", "#786c8d");
          }
        });
      } catch (error) {
        showWarning("Could not verify your reset session. Request a new reset link.");
        console.error(error);
      }
    }

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!checkPasswords()) return;

      if (newPassword.value.length < 8) {
        showWarning("Password must contain at least 8 characters.");
        return;
      }

      if (!recoveryReady) {
        showWarning("Open a valid password reset link from your email.");
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Updating...";

      try {
        const { error } = await db.auth.updateUser({
          password: newPassword.value
        });

        if (error) throw error;

        showWarning(
          "Password updated successfully! Redirecting to owner login...",
          "#16803c"
        );

        await db.auth.signOut();

        setTimeout(() => {
          window.location.href = "admin.html";
        }, 1800);
      } catch (error) {
        showWarning(
          error.message || "Could not update password. Request a new reset link."
        );
        resetButton.disabled = false;
        resetButton.textContent = "Update Password";
      }
    });

    initialiseRecovery();
  </script>
</body>
</html>
